# Lake project for the warm-backend pool (M3 commit 4).
# OPTIONAL: the M3 exit criterion uses only `lean` + `lean-toolchain` above;
# this project builds the Pantograph REPL consumed by
# src/uvil/adapters/lean/pool.py (enabled via UVIL_PANTOGRAPH).
# Build:  cd lean && lake update && lake build
# (Pantograph does not currently build on Windows; the pool is
# skip-if-absent and the plain-lean path is unaffected.)

name = "uvil-pool"
version = "0.1.0"

[[require]]
name = "Pantograph"
git = "https://github.com/streesha/pantograph.git"
rev = "master"
